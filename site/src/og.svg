<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E6EB"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- the app icon, small, with the name -->
  <g transform="translate(64 58) scale(0.1875)">
    <rect x="50" y="50" width="412" height="412" rx="92" fill="#FFFFFF" stroke="#D5D8DE" stroke-width="5"/>
    <g id="me" fill="#0A84FF">
      <rect x="96" y="195.05" width="40" height="81.9" rx="20"/>
      <rect x="166" y="158.3" width="40" height="155.4" rx="20"/>
      <rect x="236" y="131" width="40" height="210" rx="20"/>
      <rect x="306" y="176.15" width="40" height="119.7" rx="20"/>
      <rect x="376" y="205.55" width="40" height="60.9" rx="20"/>
    </g>
    <path id="line" d="M141 368 Q256 412 371 368" fill="none" stroke="#FF9F0A" stroke-width="26" stroke-linecap="round"/>
  </g>
  <text x="170" y="122" font-family="'.SF NS Rounded', 'Helvetica Neue', sans-serif" font-weight="700" font-size="44" fill="#1D1D1F">Scribe</text>

  <!-- Me: blue voice running into a line of text -->
  <g fill="#0A84FF">
    <rect x="64"  y="254" width="14" height="34" rx="7"/>
    <rect x="86"  y="238" width="14" height="66" rx="7"/>
    <rect x="108" y="227" width="14" height="88" rx="7"/>
    <rect x="130" y="246" width="14" height="50" rx="7"/>
    <rect x="152" y="258" width="14" height="26" rx="7"/>
  </g>
  <text x="194" y="292" font-family="'.SF NS Rounded', 'Helvetica Neue', sans-serif" font-weight="700" font-size="56" fill="#1D1D1F" letter-spacing="-1">Transcribe your calls on your Mac.</text>

  <!-- Them: orange voice running into the second line -->
  <g fill="#FF9F0A">
    <rect x="64"  y="380" width="14" height="26" rx="7"/>
    <rect x="86"  y="368" width="14" height="50" rx="7"/>
    <rect x="108" y="349" width="14" height="88" rx="7"/>
    <rect x="130" y="360" width="14" height="66" rx="7"/>
    <rect x="152" y="376" width="14" height="34" rx="7"/>
  </g>
  <text x="194" y="415" font-family="'.SF NS Rounded', 'Helvetica Neue', sans-serif" font-weight="700" font-size="56" fill="#6E6E73" letter-spacing="-1">No bot joins the call.</text>

  <text x="64" y="556" font-family="'.SF NS Rounded', 'Helvetica Neue', sans-serif" font-weight="500" font-size="26" fill="#6E6E73">Free and open source. No account, no server.</text>
  <text x="1136" y="556" text-anchor="end" font-family="'.SF NS Rounded', 'Helvetica Neue', sans-serif" font-weight="600" font-size="26" fill="#0068D6">scribe.finereli.com</text>
</svg>
